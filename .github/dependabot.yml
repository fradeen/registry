version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"          
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    target-branch: "dev"
    groups:
      # Name the group (this will appear in the PR title)
      all-minor-and-patch-updates:
        update-types:
          - "patch"
          - "minor"
      all-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    target-branch: "dev"
