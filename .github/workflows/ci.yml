name: CI

on:
  pull_request:
    paths-ignore:
      - 'README.md'
      - '.github/**'
      - '.gitignore'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm ci

      - name: Run Biome check
        run: npx biome check 

      - name: Run build
        run: npm run build --if-present

      - name: Run tests
        run: npm test
